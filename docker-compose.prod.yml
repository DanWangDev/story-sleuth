# Production compose for story-sleuth.
# Uses shared labf-db PostgreSQL (see labf-infra repo).
# Secrets come from .env — never hardcoded.

services:
  backend:
    image: ghcr.io/danwangdev/story-sleuth-backend:${IMAGE_TAG:-latest}
    container_name: story-sleuth-backend
    pull_policy: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5060
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - CONTENT_PATH=/app/content/passages
      - OIDC_INTERNAL_ISSUER=${OIDC_INTERNAL_ISSUER:-http://hub-backend:3009}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5060/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - default
      - labf-net
    restart: unless-stopped

  frontend:
    image: ghcr.io/danwangdev/story-sleuth-frontend:${IMAGE_TAG:-latest}
    container_name: story-sleuth-frontend
    pull_policy: always
    ports:
      - "5065:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  labf-net:
    external: true
    name: labf-net
